name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + fronteiras + testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verify (typecheck + fronteiras + testes)
        run: npm run verify

  browser-b2:
    name: Jornadas B2 no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium e dependencias do sistema
        run: npx --no-install playwright install --with-deps chromium
      - name: Validar seis jornadas B2 e reabertura no SQLite
        run: npm run test:b2
      - name: Guardar evidencias sinteticas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jornadas-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s12-b2-evidence-*/
          if-no-files-found: warn
          retention-days: 7

  adversarial:
    name: Provas adversariais W10 e W8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Reataque W10 (inclui .adv.ts)
        run: node node_modules/vitest/vitest.mjs run --config tests/redteam/vitest.config.ts --no-file-parallelism
      - name: Reataque W8 (inclui .adv.ts)
        if: ${{ !cancelled() }}
        run: node node_modules/vitest/vitest.mjs run --config tests/adv-w8/vitest.config.ts --no-file-parallelism
      - name: F1 — fechamento sem exceções e bateria completa (inclui .adv.ts)
        if: ${{ !cancelled() }}
        run: npm run verify:f1
