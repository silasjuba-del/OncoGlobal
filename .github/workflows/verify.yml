name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck + fronteiras + corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos, fronteiras e corpus
        run: npm run typecheck && npm run check:boundaries && npm run check:corpus

  tests:
    name: Testes (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Executar shard da suite completa
        run: npm test -- --shard=${{ matrix.shard }}/3

  # Keep the protected-branch check name stable. Skipped/cancelled dependencies
  # cannot turn this gate green; every shard and the real browser journeys must succeed.
  verify:
    name: typecheck + fronteiras + testes
    if: ${{ always() }}
    needs: [quality, tests, browser-b2, adversarial, pdfforge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exigir todos os gates e shards aprovados
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser-b2.result }}
          ADVERSARIAL_RESULT: ${{ needs.adversarial.result }}
          PDFFORGE_RESULT: ${{ needs.pdfforge.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$ADVERSARIAL_RESULT" = "success"
          test "$PDFFORGE_RESULT" = "success"

  browser-b2:
    name: Jornadas B2 no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium e dependencias do sistema
        run: npx --no-install playwright install --with-deps chromium
      - name: Validar seis jornadas B2 e reabertura no SQLite
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:b2
      - name: Validar consultório monousuário e ponte PDFForge ponta a ponta
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:medico-m123
      - name: Validar Flash, evolução e prontuário após reinício
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/f1/s12/browser-flash-evolucao.mjs
      - name: Validar auditoria das jornadas primeira consulta, retorno e follow-up
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/auditoria-jornadas/e2e-jornadas.mjs
      - name: Validar prescrição de QT no perfil médico até assinatura e reinício
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/auditoria-jornadas/e2e-prescricao.mjs
      - name: Validar prescrito → administrado e semáforo da intercorrência
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/auditoria-jornadas/e2e-administracao.mjs
      - name: Validar layout e movimento reduzido no Chromium
        run: node node_modules/vitest/vitest.mjs run --config tests/hostil-cursor/navegador/vitest.config.ts
      - name: Guardar evidencias sinteticas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jornadas-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s12-b2-evidence-*/
            ${{ runner.temp }}/medico-m123-evidence-*/
            ${{ runner.temp }}/auditoria-jornadas-evid-*/
            ${{ runner.temp }}/auditoria-prescricao-evid-*/
            ${{ runner.temp }}/auditoria-administracao-evid-*/
            ${{ runner.temp }}/flash-evolucao-sintetica-*/resultado.json
            ${{ runner.temp }}/flash-evolucao-sintetica-*/*.png
          if-no-files-found: warn
          retention-days: 7

  adversarial:
    name: Provas adversariais W10 e W8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Reataque W10 (inclui .adv.ts)
        run: node node_modules/vitest/vitest.mjs run --config tests/redteam/vitest.config.ts --no-file-parallelism
      - name: Reataque W8 (inclui .adv.ts)
        if: ${{ !cancelled() }}
        run: node node_modules/vitest/vitest.mjs run --config tests/adv-w8/vitest.config.ts --no-file-parallelism
      - name: F1 — fechamento sem exceções e bateria completa (inclui .adv.ts)
        if: ${{ !cancelled() }}
        run: npm run verify:f1

  pdfforge:
    name: PDFforge original e ponte Electron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pdfforge/package-lock.json
      - run: npm run pdfforge:install
      - run: npm run pdfforge:test
      - run: npm run pdfforge:build
      - name: Configurar sandbox nativo do Electron no runner
        run: |
          sudo chown root:root apps/pdfforge/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/pdfforge/node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run pdfforge:smoke
